name: Check org profile

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "profile/**"
      - "scripts/check-org-profile.sh"
      - ".github/workflows/check-org-profile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check links, endpoints and model count in profile/README.md
        run: bash scripts/check-org-profile.sh profile/README.md
